<!DOCTYPE html>

    <title>{% block titulo %}Adega Escritório{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>

        <div class="cabecalho__marca">Adega Escritório</div>

</html>
