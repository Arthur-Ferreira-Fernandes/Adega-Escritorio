{% extends "base.html" %}

{% block titulo %}Financeiro · Adega &amp; Tabacaria Escritório{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Financeiro</h1>
<p class="subtitulo-pagina">Contas a pagar e a receber.</p>

<div class="grade-stats">
    <div class="stat">
        <span class="stat__valor">{{ total_contas_pagar }}</span>
        <span class="stat__rotulo">Contas a pagar</span>
    </div>
    <div class="stat">
        <span class="stat__valor">{{ total_contas_receber }}</span>
        <span class="stat__rotulo">Contas a receber</span>
    </div>
</div>
{% endblock %}
