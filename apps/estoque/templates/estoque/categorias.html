{% extends "base.html" %}

{% block titulo %}Categorias · Adega &amp; Tabacaria Escritório{% endblock %}

{% block conteudo %}
<div class="cabecalho-pagina" style="margin-bottom: 1.5rem;">
    <div>
        <h1 class="titulo-pagina">Categorias</h1>
        <p class="subtitulo-pagina">Categorias de produtos do estoque.</p>
    </div>
    <div class="acoes-topo">
        <a href="{% url 'estoque:categorias_nova' %}"
           hx-get="{% url 'estoque:categorias_nova' %}"
           hx-target="#estoque-conteudo" hx-swap="innerHTML" hx-indicator="#estoque-conteudo"
           class="botao">Nova categoria</a>
    </div>
</div>

<div id="estoque-conteudo">
    {% include "estoque/_categorias_conteudo.html" %}
</div>
{% endblock %}
