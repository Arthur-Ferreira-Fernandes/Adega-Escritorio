{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Adega &amp; Tabacaria Escritório{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon-32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/mascara-monetaria.js' %}" defer></script>
    <script src="{% static 'js/chart.umd.js' %}" defer></script>
    <script src="{% static 'js/graficos.js' %}" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a href="{% url 'inicio' %}" class="cabecalho__marca">
            <img src="{% static 'img/logo.jpg' %}" alt="Adega &amp; Tabacaria Escritório" class="cabecalho__logo">
            <span class="cabecalho__texto">
                <strong>Adega &amp; Tabacaria</strong>
                <small>Escritório</small>
            </span>
        </a>
        <nav class="cabecalho__nav">
            <a href="{% url 'inicio' %}" class="{% if request.resolver_match.url_name == 'inicio' and not request.resolver_match.app_name %}ativo{% endif %}">Início</a>
        </nav>
    </header>
    <main class="conteudo">
        {% include "partials/_mensagens.html" %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
