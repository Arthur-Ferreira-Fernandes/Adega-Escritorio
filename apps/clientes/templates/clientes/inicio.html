{% extends "base.html" %}

{% block titulo %}Clientes · Adega &amp; Tabacaria Escritório{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Clientes</h1>
<p class="subtitulo-pagina">Clientes e fornecedores da casa.</p>

<div class="grade-stats">
    <div class="stat">
        <span class="stat__valor">{{ total_clientes }}</span>
        <span class="stat__rotulo">Clientes cadastrados</span>
    </div>
    <div class="stat">
        <span class="stat__valor">{{ total_fornecedores }}</span>
        <span class="stat__rotulo">Fornecedores cadastrados</span>
    </div>
</div>
{% endblock %}
